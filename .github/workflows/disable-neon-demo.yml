name: Disable imported Neon demo credentials

on:
  workflow_dispatch:

jobs:
  disable:
    runs-on: ubuntu-latest
    environment: neon-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Disable demo login material after validation
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NAGRIKOS_MODE: public
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo 'Set DATABASE_URL and DIRECT_URL in neon-admin environment secrets'; exit 1
          fi
          python scripts/disable_demo_credentials.py
