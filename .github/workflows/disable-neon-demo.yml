name: Disable imported Neon demo credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disable:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: neon-admin
    concurrency:
      group: neon-production-admin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Disable demo login material after validation
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NAGRIKOS_MODE: public
          NAGRIKOS_ADMIN_TARGET: production
          NEON_PRODUCTION_PROJECT_ID: winter-meadow-40329605
          NEON_PRODUCTION_BRANCH_ID: br-super-glitter-a769u0u1
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo 'Set DATABASE_URL and DIRECT_URL in neon-admin environment secrets'; exit 1
          fi
          python scripts/disable_demo_credentials.py
