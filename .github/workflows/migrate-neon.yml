name: Migrate Neon schema

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: neon-schema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install migration dependencies
        run: python -m pip install 'SQLAlchemy>=2.0,<3' 'psycopg[binary]>=3.2,<4' 'alembic>=1.14,<2'
      - name: Apply versioned schema
        working-directory: backend
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then echo 'Set DIRECT_URL in neon-schema environment secrets'; exit 1; fi
          alembic upgrade head
          alembic current
