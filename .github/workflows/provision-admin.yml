name: Provision first administrator

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run a read-only preflight or provision the first administrator'
        required: true
        type: choice
        options:
          - preflight
          - provision
      approval:
        description: 'Enter READ-ONLY-ADMIN-PREFLIGHT or PROVISION-FIRST-ADMIN for the selected mode'
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: neon-admin
    timeout-minutes: 15
    concurrency:
      group: neon-production-admin
      cancel-in-progress: false
    steps:
      - name: Validate manual dispatch
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          APPROVAL: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          if [ "$MODE" = 'preflight' ] && [ "$APPROVAL" = 'READ-ONLY-ADMIN-PREFLIGHT' ]; then
            exit 0
          fi
          if [ "$MODE" = 'provision' ] && [ "$APPROVAL" = 'PROVISION-FIRST-ADMIN' ]; then
            exit 0
          fi
          echo 'Mode and explicit approval phrase do not match'; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run protected preflight or provision first administrator
        working-directory: backend
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NAGRIKOS_MODE: public
          NAGRIKOS_ADMIN_TARGET: production
          NEON_PRODUCTION_PROJECT_ID: winter-meadow-40329605
          NEON_PRODUCTION_BRANCH_ID: br-super-glitter-a769u0u1
          NAGRIKOS_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_NAME: ${{ secrets.BOOTSTRAP_ADMIN_NAME }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ] || [ -z "$NAGRIKOS_BOOTSTRAP_ADMIN_PASSWORD" ] || [ -z "$BOOTSTRAP_ADMIN_EMAIL" ] || [ -z "$BOOTSTRAP_ADMIN_NAME" ]; then
            echo 'Required neon-admin environment secret is missing'; exit 1
          fi
          if [ "$MODE" = 'preflight' ]; then
            python scripts/provision_admin.py --preflight-only
          else
            python scripts/provision_admin.py
          fi
