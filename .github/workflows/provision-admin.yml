name: Provision first administrator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: neon-admin
    concurrency:
      group: neon-production-admin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Provision first administrator only
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NAGRIKOS_MODE: public
          NAGRIKOS_ADMIN_TARGET: production
          NEON_PRODUCTION_PROJECT_ID: winter-meadow-40329605
          NEON_PRODUCTION_BRANCH_ID: br-super-glitter-a769u0u1
          NAGRIKOS_BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_NAME: ${{ secrets.BOOTSTRAP_ADMIN_NAME }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$NAGRIKOS_BOOTSTRAP_ADMIN_PASSWORD" ] || [ -z "$BOOTSTRAP_ADMIN_EMAIL" ] || [ -z "$BOOTSTRAP_ADMIN_NAME" ]; then
            echo 'Set all neon-admin environment secrets before running'; exit 1
          fi
          python scripts/provision_admin.py --email "$BOOTSTRAP_ADMIN_EMAIL" --name "$BOOTSTRAP_ADMIN_NAME"
